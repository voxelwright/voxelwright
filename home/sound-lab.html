<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Village listening room</title>
    <style>
      :root {
        --paper: #f3e8d4; --card: #fbf5ea; --ink: #3d2b1f; --soft: #7a6350; --line: #dcc9a8;
        --accent: #6b4a2b; --pick: #c4503a; --pick-bg: #f6dccf; --ok: #4f7a45; --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.45 var(--serif); }
      main { max-width: 760px; margin: 0 auto; padding: 24px 16px 96px; }
      h1 { font-size: 30px; font-weight: 600; margin: 4px 0 6px; letter-spacing: .2px; }
      h2 { font-size: 21px; margin: 0; font-weight: 600; }
      p { margin: 0 0 10px; }
      .lede { color: var(--soft); margin-bottom: 18px; }
      .small { font-size: 13.5px; color: var(--soft); }
      button, .link { font: inherit; color: var(--ink); cursor: pointer; border-radius: 14px; border: 1.5px solid var(--line);
        background: var(--card); min-height: 48px; padding: 10px 16px; text-decoration: none; display: inline-flex; align-items: center; gap: 8px;
        -webkit-tap-highlight-color: transparent; }
      button:focus-visible, .link:focus-visible, textarea:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }
      button:active { transform: translateY(1px); }
      .start { width: 100%; justify-content: center; font-size: 21px; min-height: 64px; background: var(--accent); color: #fbf5ea; border-color: var(--accent); }
      .bar { position: sticky; top: 0; z-index: 2; background: var(--paper); padding: 10px 0; display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
        border-bottom: 1px dashed var(--line); margin-bottom: 18px; }
      .bar label { display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 6px; cursor: pointer; }
      .bar input[type=checkbox] { width: 24px; height: 24px; accent-color: var(--accent); }
      .status { margin-left: auto; font-size: 14px; color: var(--soft); }
      .status.saved { color: var(--ok); }
      section.cue { background: var(--card); border: 1.5px solid var(--line); border-radius: 18px; padding: 16px; margin: 0 0 16px;
        box-shadow: 0 1px 0 rgba(60, 40, 20, .06); }
      .cue header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 10px; }
      .cue .name { font: 13px/1 ui-monospace, Menlo, monospace; color: var(--soft); }
      .variant { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: center; padding: 10px 0; border-top: 1px dashed var(--line); }
      .variant:first-of-type { border-top: 0; }
      .play { min-width: 112px; justify-content: center; font-weight: 600; }
      .play.on { background: #efe0c4; }
      .variant .what { font-size: 15.5px; }
      .variant video { grid-column: 1 / -1; width: 100%; border-radius: 10px; background: #2a1d16; aspect-ratio: 16 / 9; }
      .picks { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 10px; }
      .picks button { min-width: 64px; justify-content: center; }
      .picks button[aria-pressed=true] { background: var(--pick-bg); border-color: var(--pick); color: var(--pick); font-weight: 600; }
      textarea { width: 100%; min-height: 48px; font: 16px/1.4 var(--serif); color: var(--ink); background: #fffaf1; border: 1.5px solid var(--line);
        border-radius: 12px; padding: 10px 12px; resize: vertical; }
      .watch { font-size: 14px; min-height: 40px; padding: 6px 12px; }
      .before { font-size: 15px; color: var(--soft); background: #f6ecdb; border-radius: 10px; padding: 8px 12px; margin: 0 0 6px; }
      details.round1 { margin-top: 28px; }
      details.round1 > summary { cursor: pointer; min-height: 48px; display: flex; align-items: center; padding: 10px 16px; border: 1.5px dashed var(--line);
        border-radius: 14px; color: var(--soft); list-style-position: inside; }
      details.round1[open] > summary { margin-bottom: 8px; }
      .divider { margin: 28px 0 14px; font-size: 15px; color: var(--soft); text-transform: uppercase; letter-spacing: 1.5px; }
      footer { margin-top: 32px; font-size: 14px; color: var(--soft); }
      footer li { margin-bottom: 4px; }
      footer a { color: var(--accent); }
      .actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 20px 0; }
      .actions .save { background: var(--accent); color: #fbf5ea; border-color: var(--accent); }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <h1>Listening room</h1>
      <p class="lede">Each card is one moment in the home. Play the versions, pick the one you like, and add a note if something feels off. Your picks save as you go, and the home plays them.</p>
      <button class="start" id="start" type="button">Start listening</button>
      <p class="small" id="hint">Headphones help. On an iPhone, turn off silent mode first: it mutes web audio.</p>
      <div id="lab" hidden>
        <div class="bar">
          <label><input type="checkbox" id="music" /> With music underneath</label>
          <span class="status" id="status" role="status"></span>
        </div>
        <div id="cues"></div>
        <div class="actions">
          <button class="save" id="save" type="button">Save picks</button>
          <a class="link" id="try" href="./?talk=npc">Try these in the home</a>
        </div>
        <footer id="credits"></footer>
      </div>
    </main>
    <script type="module" src="/src/lab/sound-lab.ts"></script>
  </body>
</html>
