[package]
license = "Apache-2.0"
name = "village-master"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Village's master server: lists player-hosted lobbies and passes one WebRTC offer and one answer per join."
publish = false

[[bin]]
name = "village-master"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "ws", "json"] }
tokio = { version = "1.54.1", features = ["rt", "net", "time", "macros", "sync", "signal"] }
tower-http = { version = "0.7.1", default-features = false, features = ["cors", "timeout"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
clap = { version = "4.6.10", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
getrandom = "0.3.4"
hyper = { version = "1.13.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio", "service"] }
http-body-util = "0.1"
tower = { version = "0.5", default-features = false, features = ["util"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt", "net", "time", "macros", "sync"] }
tokio-tungstenite = "0.29.0"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
