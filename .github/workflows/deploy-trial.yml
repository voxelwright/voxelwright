name: deploy-trial

# Throwaway (#450): the deploy's build on Ubuntu, up to a dry run, with no secrets. Deleted before merge.
on:
  push:
    branches: [feature/450-deploy]

permissions:
  contents: read

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            deploy/package-lock.json

      # The site, under /blog/.
      - run: npm ci
        working-directory: site
      - run: npm test
        working-directory: site
      - run: npm run build
        working-directory: site

      # The realm: its core, then the page with the pinned release, from the data bundle (deploy/data.mjs) the pin names.
      - run: rustup target add wasm32-unknown-unknown
      - run: node deploy/data.mjs fetch
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm run core
        working-directory: engine
      - run: node sf/build.mjs
        working-directory: engine

      # One folder, one Worker.
      - run: npm ci
        working-directory: deploy
      - run: npm test
        working-directory: deploy
      - run: node assemble.mjs
        working-directory: deploy
      - run: npx cf deploy --dry-run
        working-directory: deploy
      - name: the live check's length line, on GNU grep and stat
        working-directory: deploy
        run: |
          manifest="/$(node -p "require('../engine/sf/pilot/current.json').manifest")"
          printf 'HTTP/2 200\r\ncontent-encoding: br\r\ncontent-length: %s\r\n\r\n' "$(stat -c%s "dist$manifest.br")" > headers.txt
          grep -qi '^content-encoding: br' headers.txt
          grep -qi "^content-length: $(stat -c%s "dist$manifest.br")"$'\r'"\?$" headers.txt
          printf 'content-length: 1\r\n' > wrong.txt
          ! grep -qi "^content-length: $(stat -c%s "dist$manifest.br")"$'\r'"\?$" wrong.txt
          du -sh dist; find dist -type f | wc -l
