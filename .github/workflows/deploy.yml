name: deploy

# Build once on main. Check each Worker after publishing it and record its outcome.
on:
  push:
    branches: [main]
    # What the deployed folder is made from; a merge that changes none of it leaves the site as it is.
    paths: [engine/**, site/**, deploy/**, .github/workflows/deploy.yml]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            deploy/package-lock.json

      # The private repo opts in before either build. The release tag pins the bytes we unpack.
      - name: fetch private egg media
        if: vars.EGG_OVERLAY_TAG != ''
        shell: bash
        env:
          EGG_OVERLAY_TAG: ${{ vars.EGG_OVERLAY_TAG }}
          EGG_OVERLAY_REPO: ${{ vars.EGG_OVERLAY_REPO || github.repository }}
          GH_TOKEN: ${{ secrets.EGG_OVERLAY_TOKEN || github.token }}
        run: |
          if [[ ! "$EGG_OVERLAY_TAG" =~ ^eggs-overlay-[0-9a-f]{16}$ ]]; then
            echo "EGG_OVERLAY_TAG must name an eggs-overlay release with a 16-digit SHA-256 prefix" >&2
            exit 1
          fi
          overlay=$(mktemp -d "$RUNNER_TEMP/egg-overlay.XXXXXX")
          gh release download "$EGG_OVERLAY_TAG" --repo "$EGG_OVERLAY_REPO" --pattern egg-media.tar --dir "$overlay"
          digest=$(sha256sum "$overlay/egg-media.tar")
          if [[ "${digest:0:16}" != "${EGG_OVERLAY_TAG#eggs-overlay-}" ]]; then
            echo "Egg media overlay SHA-256 mismatch" >&2
            exit 1
          fi
          mkdir "$overlay/media"
          tar -xf "$overlay/egg-media.tar" -C "$overlay/media"
          printf 'VOXELWRIGHT_EGG_MEDIA=%s\n' "$overlay/media" >> "$GITHUB_ENV"

      # The site, under /blog/.
      - run: npm ci
        working-directory: site
      - run: npm test
        working-directory: site
      - run: npm run build
        working-directory: site

      # The realm: its core, then the page with the pinned release, from the data bundle (deploy/data.mjs) the pin names.
      - run: rustup target add wasm32-unknown-unknown
      - run: node deploy/data.mjs fetch
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm run core
        working-directory: engine
      - run: node sf/build.mjs
        working-directory: engine

      # Both asset folders must build before either Worker moves.
      - run: npm ci
        working-directory: deploy
      - run: npm test
        working-directory: deploy
      - run: node assemble.mjs
        working-directory: deploy
      - name: deploy and check both Workers
        run: bash publish.sh
        working-directory: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: record GitHub release
        run: node release.mjs
        working-directory: deploy
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_BEFORE_SHA: ${{ github.event.before }}
