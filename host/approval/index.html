<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Keep the Elder's change?</title>
  <link rel="stylesheet" href="/approval.css">
  <script src="/approval.js" defer></script>
</head>
<body>
  <main class="sheet" aria-live="polite">
    <p class="head">The Elder</p>
    <h1 id="request">Loading the change…</h1>
    <p id="who" class="who"></p>
    <div id="pictures" class="pictures" hidden>
      <figure><img id="before" alt="The home before the change"><figcaption>Before</figcaption></figure>
      <figure><img id="after" alt="The home with the change"><figcaption>After</figcaption></figure>
    </div>
    <ol id="stages" class="stages" aria-label="Its checks"></ol>
    <p id="status" class="status" role="status"></p>
    <div id="actions" class="actions"></div>
    <p id="how" class="how" hidden>Press and hold a button to choose.</p>
    <p id="hint" class="hint" hidden>Click anywhere on this page, then choose.</p>
    <p id="note" class="note" role="alert" hidden></p>
    <p class="small">Only this page can keep or undo a change. The home itself cannot.</p>
  </main>
</body>
</html>
