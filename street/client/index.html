<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Block</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #bfd9ee; touch-action: none; -webkit-user-select: none; user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .panel { font: 12px/1.5 ui-monospace, Menlo, monospace; color: #1d2733; background: rgba(255, 255, 255, 0.78); border-radius: 8px; }
  #more { position: fixed; left: 8px; top: 8px; border: 0; padding: 7px 10px; }
  /* The numbers and test knobs are a workshop panel: folded away until asked for, one column so nothing overlaps on a phone. */
  #workshop { position: fixed; left: 8px; top: 44px; right: 8px; max-width: 460px; display: none; flex-direction: column; gap: 6px; pointer-events: none; }
  body.open #workshop { display: flex; }
  #hud { padding: 6px 9px; white-space: pre-wrap; }
  #knobs { display: flex; gap: 6px; flex-wrap: wrap; pointer-events: auto; }
  #knobs button { font: 12px ui-monospace, Menlo, monospace; padding: 7px 9px; border: 0; border-radius: 8px; background: rgba(255, 255, 255, 0.78); color: #1d2733; }
  #knobs button[aria-pressed="true"] { background: #1d2733; color: #fff; }
  #help { padding: 5px 8px; }
  /* The sentence: the one thing always on screen. */
  #ask { position: fixed; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; gap: 6px; width: min(640px, calc(100vw - 16px)); }
  #ask input { flex: 1; min-width: 0; font: 16px/1.3 ui-rounded, system-ui, sans-serif; padding: 11px 14px; border: 0; border-radius: 14px; background: rgba(255, 255, 255, 0.9); color: #1d2733; outline: none; box-shadow: 0 2px 10px rgba(29, 39, 51, 0.18); }
  #ask button { font: 600 14px ui-rounded, system-ui, sans-serif; padding: 0 13px; border: 0; border-radius: 14px; background: rgba(255, 255, 255, 0.9); color: #1d2733; box-shadow: 0 2px 10px rgba(29, 39, 51, 0.18); }
  #ask #mode { background: #1d2733; color: #fff; min-width: 76px; }
  .head { position: fixed; left: 0; top: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; pointer-events: none; will-change: transform; }
  .head .name { font: 600 12px ui-rounded, system-ui, sans-serif; color: #fff; text-shadow: 0 1px 3px rgba(29, 39, 51, 0.75); white-space: nowrap; }
  .bubble { max-width: min(260px, 60vw); padding: 6px 10px; border-radius: 12px; font: 14px/1.3 ui-rounded, system-ui, sans-serif; color: #1d2733; background: rgba(255, 255, 255, 0.94); box-shadow: 0 2px 8px rgba(29, 39, 51, 0.2); text-align: center; }
  #invite { padding: 8px 10px; pointer-events: auto; white-space: normal; }
  #invite code { display: block; margin: 6px 0; padding: 6px; background: rgba(29, 39, 51, 0.08); border-radius: 6px; word-break: break-all; user-select: all; -webkit-user-select: all; }
  /* At the home's door: the way in, over the sentence. */
  #door { position: fixed; left: 50%; bottom: calc(max(14px, env(safe-area-inset-bottom)) + 58px); transform: translateX(-50%); font: 600 15px ui-rounded, system-ui, sans-serif; padding: 11px 18px; border: 0; border-radius: 16px; background: #f6d79a; color: #4a3520; box-shadow: 0 3px 12px rgba(74, 53, 32, 0.3); }
  #door kbd { font: inherit; opacity: 0.6; margin-left: 8px; }
  #fade { position: fixed; inset: 0; background: #fff3dc; opacity: 0; pointer-events: none; transition: opacity 0.45s ease; }
  #fade.on { opacity: 1; }
  /* What someone wants: it stays over their head until they have it. From far it is only a mark. */
  .bubble.wants { background: rgba(255, 245, 210, 0.97); box-shadow: 0 2px 8px rgba(74, 53, 32, 0.25), inset 0 0 0 1.5px #e9c46a; }
  .bubble.wants.far { padding: 1px 9px; font-weight: 700; color: #8a6418; }
  /* A problem solved: one line everyone reads. */
  #notice { position: fixed; left: 50%; top: max(14px, env(safe-area-inset-top)); transform: translate(-50%, -8px); max-width: min(560px, calc(100vw - 110px)); padding: 10px 18px; border-radius: 16px; font: 600 15px/1.35 ui-rounded, system-ui, sans-serif; color: #4a3520; background: #fff3c9; box-shadow: 0 4px 16px rgba(74, 53, 32, 0.28); text-align: center; opacity: 0; pointer-events: none; transition: opacity 0.35s ease, transform 0.35s ease; }
  #notice.on { opacity: 1; transform: translate(-50%, 0); }
  .bubble.making { font-style: italic; color: #5b6673; }
  .bubble.sorry { background: rgba(255, 240, 236, 0.96); }
  /* A narrow screen: the sentence keeps the whole width, and the three small buttons sit in a row above it. */
  @media (max-width: 560px) {
    #ask { flex-wrap: wrap; justify-content: flex-end; }
    #ask::before { content: ''; order: 2; flex-basis: 100%; }
    #ask #undo, #ask #top, #ask #bring { order: 1; padding: 8px 12px; font-size: 13px; }
    #ask #mode { order: 3; }
    #ask input { order: 4; }
    #door { bottom: calc(max(14px, env(safe-area-inset-bottom)) + 104px); }
  }
  @media (pointer: coarse) { .keys { display: none; } }
  @media (pointer: fine) { .touch { display: none; } }
</style>
</head>
<body>
<button id="more" class="panel">numbers</button>
<div id="workshop">
  <div id="hud" class="panel">finding the street…</div>
  <div id="knobs"></div>
  <div id="invite" class="panel" hidden>A key for one agent of yours, good for 12 hours. Run this where its Claude Code is, then tell it to join the street: <code></code><button id="copy" type="button">copy</button></div>
  <div id="help" class="panel"><span class="keys">WASD walk · Space jump · Q E or drag to turn · Enter to type</span><span class="touch">left side walks · right side turns · tap jumps</span></div>
</div>
<form id="ask" autocomplete="off">
  <button id="mode" type="button" title="make a thing, change the one you face, or say something">make</button>
  <input id="words" maxlength="200" enterkeyhint="send" aria-label="what to make or say">
  <button id="undo" type="button" title="take back the last thing you made">undo</button>
  <button id="top" type="button" title="back to the top of the street">top</button>
  <button id="bring" type="button" title="a key that lets an agent of yours join">+agent</button>
</form>
<button id="door" type="button" hidden>Go inside<kbd class="keys">F</kbd></button>
<div id="notice" role="status"></div>
<div id="fade"></div>
<script type="module" src="./main.ts"></script>
</body>
</html>
