<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Block</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #bfd9ee; touch-action: none; -webkit-user-select: none; user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .panel { font: 12px/1.5 ui-monospace, Menlo, monospace; color: #1d2733; background: rgba(255, 255, 255, 0.78); border-radius: 8px; }
  #more { position: fixed; left: 8px; top: 8px; border: 0; padding: 7px 10px; }
  /* The numbers and test knobs are a workshop panel: folded away until asked for, one column so nothing overlaps on a phone. */
  #workshop { position: fixed; left: 8px; top: 44px; right: 8px; max-width: 460px; display: none; flex-direction: column; gap: 6px; pointer-events: none; }
  body.open #workshop { display: flex; }
  #hud { padding: 6px 9px; white-space: pre-wrap; }
  #knobs { display: flex; gap: 6px; flex-wrap: wrap; pointer-events: auto; }
  #knobs button { font: 12px ui-monospace, Menlo, monospace; padding: 7px 9px; border: 0; border-radius: 8px; background: rgba(255, 255, 255, 0.78); color: #1d2733; }
  #knobs button[aria-pressed="true"] { background: #1d2733; color: #fff; }
  #help { padding: 5px 8px; }
  /* The sentence: the one thing always on screen. */
  #ask { position: fixed; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; gap: 6px; width: min(640px, calc(100vw - 16px)); }
  #ask input { flex: 1; min-width: 0; font: 16px/1.3 ui-rounded, system-ui, sans-serif; padding: 11px 14px; border: 0; border-radius: 14px; background: rgba(255, 255, 255, 0.9); color: #1d2733; outline: none; box-shadow: 0 2px 10px rgba(29, 39, 51, 0.18); }
  #ask button { font: 600 14px ui-rounded, system-ui, sans-serif; padding: 0 13px; border: 0; border-radius: 14px; background: rgba(255, 255, 255, 0.9); color: #1d2733; box-shadow: 0 2px 10px rgba(29, 39, 51, 0.18); }
  #ask #mode { background: #1d2733; color: #fff; min-width: 62px; }
  .bubble { position: fixed; left: 0; top: 0; max-width: min(260px, 60vw); padding: 6px 10px; border-radius: 12px; font: 14px/1.3 ui-rounded, system-ui, sans-serif; color: #1d2733; background: rgba(255, 255, 255, 0.94); box-shadow: 0 2px 8px rgba(29, 39, 51, 0.2); pointer-events: none; text-align: center; will-change: transform; }
  .bubble.making { font-style: italic; color: #5b6673; }
  .bubble.sorry { background: rgba(255, 240, 236, 0.96); }
  @media (pointer: coarse) { .keys { display: none; } }
  @media (pointer: fine) { .touch { display: none; } }
</style>
</head>
<body>
<button id="more" class="panel">numbers</button>
<div id="workshop">
  <div id="hud" class="panel">finding the street…</div>
  <div id="knobs"></div>
  <div id="help" class="panel"><span class="keys">WASD walk · Space jump · Q E or drag to turn · Enter to type</span><span class="touch">left side walks · right side turns · tap jumps</span></div>
</div>
<form id="ask" autocomplete="off">
  <button id="mode" type="button" title="make a thing, or say something">make</button>
  <input id="words" maxlength="200" enterkeyhint="send" aria-label="what to make or say">
  <button id="undo" type="button" title="take back the last thing you made">undo</button>
  <button id="top" type="button" title="back to the top of the street">top</button>
</form>
<script type="module" src="./main.ts"></script>
</body>
</html>
