<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Renderer seam</title>
<link rel="stylesheet" href="/packages/voxelmorphism/voxelmorphism.css">
<style>html { background: var(--vx-ground); color: var(--vx-ink); font-family: var(--vx-font); } body { padding: 3rem; display: grid; gap: 2rem; justify-items: start; }</style>
<!-- A test page: the kit is handed its renderer late, the way a WebGPU backend will hand it.
     ?late=ms sets the delay, ?none makes the promise settle on nothing, ?fail makes it reject. -->
<button class="vx-button" id="a">Handed late</button>
<label class="vx-toggle"><input type="checkbox" role="switch" checked><span class="vx-switch"></span>Switch</label>
<div id="later"></div>
<script type="module">
  import { use, adopt, ready, plain, release } from '/packages/voxelmorphism/src/index.js';
  import { Renderer } from '/packages/voxelmorphism/src/core/gl.js';
  const q = new URLSearchParams(location.search);
  const late = Number(q.get('late') ?? 300);
  const log = (window.seam = { before: null, after: null, calls: 0 });
  const made = new Promise((res, rej) => setTimeout(() => {
    if (q.has('fail')) return rej(new Error('no adapter'));
    if (q.has('none')) return res(null);
    if (q.has('own')) {
      // a stand-in for a backend that owns each part's canvas: it takes its own context on the
      // element it is handed and fills the part's box
      return res({ ownsCanvas: true, draw(frame, canvas) {
        log.calls++;
        log.target = canvas instanceof HTMLCanvasElement ? 'canvas' : 'context';
        const c = canvas.getContext('2d');
        c.clearRect(0, 0, canvas.width, canvas.height);
        c.fillStyle = '#0e22ff'; c.fillRect(frame.ox, frame.oy, frame.s * 8, frame.s * 4);
        return true;
      } });
    }
    const r = new Renderer();
    const draw = r.draw.bind(r);
    r.draw = (...a) => { log.calls++; log.target = a[1] instanceof HTMLCanvasElement ? 'canvas' : 'context'; return draw(...a); };
    res(r);
  }, late));
  use(made);
  const first = adopt();
  // a part added while the renderer is on its way, and one released again before it arrives
  later.innerHTML = '<button class="vx-button" data-vx-material="chalk" id="b">Added meanwhile</button><button class="vx-button" id="c">Released meanwhile</button>';
  adopt(later);
  release(document.getElementById('c'));
  log.before = { adoptReturned: first, plain: plain(), live: document.querySelectorAll('[data-vx-live]').length };
  const st = await ready();
  await new Promise((r) => setTimeout(r, 200));
  log.after = { stage: !!st, plain: plain(), live: document.querySelectorAll('[data-vx-live]').length, lives: st ? st.lives.size : 0, kitContexts: st ? [...st.lives.values()].filter((l) => l.ctx).length : 0 };
  // a renderer that then loses its device for good
  if (q.has('lost') && st) {
    st.renderer.onfail();
    await new Promise((r) => setTimeout(r, 50));
    log.lost = { plain: plain(), live: document.querySelectorAll('[data-vx-live]').length, canvases: document.querySelectorAll('.vx-canvas').length, adoptAfter: adopt() };
  }
  document.documentElement.dataset.ready = '';
</script>
</html>
