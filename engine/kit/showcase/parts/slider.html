<!doctype html>
<html lang="en" data-vx-look="lit">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slider</title>
<link rel="stylesheet" href="/packages/voxelmorphism/voxelmorphism.css">
<link rel="stylesheet" href="parts.css">
<style>
  .knobs { display: grid; gap: calc(var(--vx) * 3); inline-size: min(100%, calc(var(--vx) * 96)); }
  .knob { display: grid; gap: calc(var(--vx) * 1); font-weight: 500; }
  .knob > span:first-child { display: flex; justify-content: space-between; gap: calc(var(--vx) * 4); }
  .knob output { color: var(--vx-ink-quiet); font-variant-numeric: tabular-nums; }
</style>
<script>
  // ?theme=dark or ?theme=light fixes the time of day; otherwise the system's own setting holds
  (function () { var t = new URLSearchParams(location.search).get('theme'); if (t) document.documentElement.dataset.theme = t; setTimeout(function () { document.documentElement.dataset.ready = '1'; }, 5000); })();
</script>
</head>
<body>
<main class="vx-card sheet">
  <header>
    <h1>Slider</h1>
    <p class="what">A fader: a knob in a slot, the slot in a steel bezel. A line across the knob's top reads its place; behind the knob the slot is full of the accent's light.</p>
  </header>
  <div class="vx-groove" role="separator"></div>
  <section>
    <h2>In use: how a deploy scales</h2>
    <div class="knobs">
      <label class="knob"><span>Instances <output id="inst-out">4</output></span>
        <span class="vx-slider"><input type="range" min="1" max="12" value="4" id="inst"></span></label>
      <label class="knob"><span>Memory for each <output id="mem-out">512 MB</output></span>
        <span class="vx-slider"><input type="range" min="128" max="2048" step="128" value="512" id="mem"></span></label>
      <label class="knob"><span><span lang="uk">Одночасних збірок</span> <output id="par-out">2</output></span>
        <span class="vx-slider"><input type="range" min="1" max="6" value="2" id="par"></span></label>
    </div>
  </section>
  <section>
    <h2>Every state</h2>
    <div class="knobs">
      <label class="knob"><span>At the least</span><span class="vx-slider"><input type="range" min="0" max="10" value="0"></span></label>
      <label class="knob"><span>Half way</span><span class="vx-slider"><input type="range" min="0" max="1000" value="500" id="fine"></span></label>
      <label class="knob"><span>At the most</span><span class="vx-slider"><input type="range" min="0" max="10" value="10"></span></label>
      <label class="knob"><span>Off</span><span class="vx-slider"><input type="range" min="0" max="10" value="6" disabled id="off"></span></label>
      <label class="knob" dir="rtl"><span>Right to left</span><span class="vx-slider"><input type="range" min="0" max="10" value="3" id="rtl"></span></label>
    </div>
  </section>
</main>
<script type="module">
  import { show } from './parts.js';
  import { LOOKS } from '/packages/voxelmorphism/src/index.js';
  import { parts } from '/packages/voxelmorphism/src/looks/lit-existing.js';
  Object.assign(LOOKS.lit.parts, parts);
  const say = (id, fn) => { const i = document.getElementById(id), o = document.getElementById(id + '-out'); i.addEventListener('input', () => { o.textContent = fn(i.value); }); };
  say('inst', (v) => v);
  say('mem', (v) => (v >= 1024 ? v / 1024 + ' GB' : v + ' MB'));
  say('par', (v) => v);
  show();
</script>
</body>
</html>
