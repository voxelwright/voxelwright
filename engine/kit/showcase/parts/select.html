<!doctype html>
<html lang="en" data-vx-look="lit">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Select</title>
<link rel="stylesheet" href="../../voxelmorphism.css">
<link rel="stylesheet" href="parts.css">
<style>
  .form { display: flex; flex-wrap: wrap; gap: calc(var(--vx) * 6) calc(var(--vx) * 9); margin: 0; max-inline-size: 100%; }
  .said { color: var(--vx-ink-quiet); font-size: 0.9375rem; overflow-wrap: anywhere; }
  .states { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, calc(var(--vx) * 60)), 1fr)); gap: calc(var(--vx) * 6) calc(var(--vx) * 9); inline-size: 100%; align-items: start; }
</style>
<script>
  // ?theme=dark or ?theme=light fixes the time of day; otherwise the system's own setting holds
  (function () { var t = new URLSearchParams(location.search).get('theme'); if (t) document.documentElement.dataset.theme = t; setTimeout(function () { document.documentElement.dataset.ready = '1'; }, 5000); })();
</script>
</head>
<body>
<main class="vx-card sheet">
  <header>
    <h1>Select</h1>
    <p class="what">A key with a chevron. It opens the browser's own picker, so it works the same under a thumb, a mouse and a keyboard.</p>
  </header>
  <div class="vx-groove" role="separator"></div>
  <section>
    <h2>In use: how harbor-api is built</h2>
    <form class="form" id="build">
      <div class="vx-field">
        <label class="vx-field-label" for="region">Region</label>
        <span class="vx-select"><select id="region" name="region">
          <option value="fra">Frankfurt</option>
          <option value="iad" selected>Virginia</option>
          <option value="sin">Singapore</option>
          <option value="syd">Sydney</option>
        </select></span>
      </div>
      <div class="vx-field">
        <label class="vx-field-label" for="runtime">Runtime</label>
        <span class="vx-select"><select id="runtime" name="runtime">
          <optgroup label="Node">
            <option>Node 24</option>
            <option selected>Node 22</option>
          </optgroup>
          <optgroup label="Other">
            <option>Bun 1.3</option>
            <option>Deno 2</option>
          </optgroup>
        </select></span>
      </div>
      <div class="vx-field">
        <label class="vx-field-label" for="keep">Keep builds for</label>
        <span class="vx-select"><select id="keep" name="keep">
          <option>A day</option>
          <option selected>A week</option>
          <option>A month</option>
        </select></span>
      </div>
    </form>
    <p class="said" id="said" role="status">Builds in Virginia on Node 22, kept for a week.</p>
  </section>
  <section>
    <h2>Every state</h2>
    <div class="states">
      <div class="vx-field">
        <label class="vx-field-label" for="s-rest">At rest</label>
        <span class="vx-select"><select id="s-rest"><option>Mina</option><option>Ada</option></select></span>
      </div>
      <div class="vx-field">
        <label class="vx-field-label" for="s-none">Nothing chosen yet</label>
        <span class="vx-select"><select id="s-none" required><option value="" selected disabled hidden>Choose a team</option><option>fogline</option><option>saltmarsh</option></select></span>
      </div>
      <div class="vx-field">
        <label class="vx-field-label" for="s-off">Switched off</label>
        <span class="vx-select"><select id="s-off" disabled><option>Frankfurt</option></select></span>
      </div>
      <div class="vx-field">
        <label class="vx-field-label" for="s-wide">Made wider</label>
        <span class="vx-select" style="inline-size: 100%"><select id="s-wide"><option>Day</option><option>Night</option></select></span>
      </div>
      <div class="vx-field">
        <label class="vx-field-label" for="s-long">A choice too long for it</label>
        <span class="vx-select" style="inline-size: calc(var(--vx) * 44)"><select id="s-long"><option>harbor-api-staging-preview</option><option>fogline</option></select></span>
      </div>
      <div class="vx-field">
        <label class="vx-field-label" for="s-uk">Що робити після перевірки</label>
        <span class="vx-select"><select id="s-uk"><option>Розгорнути на сервері</option><option>Нічого</option></select></span>
      </div>
    </div>
  </section>
</main>
<script type="module">
  import { show } from './parts.js';
  import { select } from '../../src/components/select.js';
  show(select);
  const form = document.getElementById('build'), said = document.getElementById('said');
  const text = (el) => el.selectedOptions[0].textContent.trim();
  form.addEventListener('change', () => { said.textContent = `Builds in ${text(form.elements.region)} on ${text(form.elements.runtime)}, kept for ${text(form.elements.keep).toLowerCase()}.`; });
</script>
</body>
</html>
