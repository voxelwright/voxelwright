<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Village engine</title>
<style>
  html, body { margin: 0; height: 100%; background: #10141a; color: #e8ecf1; font: 15px/1.45 -apple-system, system-ui, sans-serif; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; }
  #panel { position: fixed; left: max(12px, env(safe-area-inset-left)); bottom: max(12px, env(safe-area-inset-bottom)); max-width: min(560px, calc(100vw - 24px)); padding: 12px 14px; border-radius: 12px; background: rgba(12, 16, 22, 0.78); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  #name { margin: 0 0 2px; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.6; }
  #head { margin: 0 0 6px; font-size: 17px; font-weight: 600; }
  #lines { max-height: 38vh; overflow: auto; font-variant-numeric: tabular-nums; opacity: 0.85; }
  #lines p { margin: 0; }
</style>
</head>
<body>
<canvas></canvas>
<div id="panel">
  <p id="name">Village engine · measuring this device</p>
  <p id="head">Starting</p>
  <div id="lines"></div>
</div>
<script type="module" src="/probe/main.ts"></script>
</body>
</html>
