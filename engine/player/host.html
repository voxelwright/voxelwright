<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Two scenes in a page</title>
<style>
  body { margin: 0 auto; max-width: 720px; padding: 24px 16px 80px; background: #f6f5f0; color: #14181d; font: 17px/1.55 Georgia, serif; }
  h1 { font-size: 28px; margin: 0 0 8px; }
  figure { margin: 24px 0; }
  .scene { position: relative; aspect-ratio: 16 / 10; border-radius: 10px; overflow: hidden; background: #d9d6cb; }
  /* The frame is never hidden while it is waited for: a browser draws no frames in a hidden frame of another origin, so
     a player kept out of sight until it says `ready` never says it. The flat picture lies over it instead. */
  .scene iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  /* The picture a page shows where the scene cannot be: here a plain card that says so. */
  .scene .flat { position: absolute; inset: 0; z-index: 1; display: grid; place-items: center; background: #d9d6cb; font: 14px system-ui, sans-serif; color: #5b5f66; }
  .scene.ready .flat { display: none; }
  figcaption { margin-top: 6px; font: 13px system-ui, sans-serif; color: #5b5f66; }
</style>
</head>
<body>
<!--
  A page that holds two players (#419), as a post would: each an iframe on the player's page, each with a flat
  picture over it that is shown until the player says `ready`, and for good if it says `unsupported` or `error`, or
  says nothing at all for five seconds (a player says `unsupported` or `loading` within one). `?player=` is where the player's page is (another origin, as it would be for a
  post that borrows a scene); unsaid, it is the one beside this page.
-->
<h1>Two scenes in a page</h1>
<p>Each picture below is the engine, running from plain files in a frame of its own. Drag to turn it, tap to throw a ball, hold to throw it hard.</p>
<figure>
  <div class="scene" data-scene="scenes/sample.json"><div class="flat">Loading the scene</div></div>
  <figcaption></figcaption>
</figure>
<p>Words between the two, as a post has: the page scrolls by the wheel and by an upward swipe over a scene.</p>
<figure>
  <div class="scene" data-scene="scenes/sample.json"><div class="flat">Loading the scene</div></div>
  <figcaption></figcaption>
</figure>
<script type="module">
  const player = new URL(new URLSearchParams(location.search).get('player') ?? 'index.html', location.href)
  /** What each player said and when, for whoever looks (test/player.mjs). */
  const heard = []
  Object.assign(globalThis, { heard })
  for (const box of document.querySelectorAll('.scene')) {
    const frame = document.createElement('iframe'), began = performance.now(), flat = box.querySelector('.flat'), note = box.parentElement.querySelector('figcaption')
    const to = new URL(player)
    to.searchParams.set('scene', box.dataset.scene)
    frame.src = to.href
    frame.title = 'A scene to turn and poke'
    // What stands in the box: the flat picture until the player is ready, and again if it then fails.
    const show = (state, text) => { box.dataset.state = state; box.classList.toggle('ready', state === 'ready'); flat.textContent = state === 'ready' ? '' : 'The flat picture stands here'; note.textContent = text }
    // A player says `unsupported` or `loading` within a second. One that has said neither in five never loaded.
    const quiet = setTimeout(() => show('silent', 'The player said nothing in five seconds: the flat picture stays.'), 5000)
    addEventListener('message', (e) => {
      // Only this frame's own player, by who sent it: what it says is read as data.
      if (e.source !== frame.contentWindow || e.data?.village !== 'player') return
      const ms = Math.round(performance.now() - began)
      heard.push({ type: e.data.type, ms, data: e.data })
      clearTimeout(quiet)
      // `loading` changes nothing seen: the flat picture stays until `ready`, however long the download takes.
      if (e.data.type === 'ready') show('ready', `Ready ${ms} ms after the frame was added (${Number(e.data.ms)} ms by its own clock).`)
      else if (e.data.type === 'unsupported') show('unsupported', `No WebGPU here, said after ${ms} ms: the flat picture stays.`)
      else if (e.data.type === 'error') show('error', 'The scene failed: the flat picture stays.')
    })
    box.append(frame)
  }
</script>
</body>
</html>
