<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Village engine</title>
<style>
  html, body { margin: 0; height: 100%; background: #10141a; color: #e8ecf1; font: 13px/1.4 -apple-system, system-ui, sans-serif; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; }
  /* The line that says how the page is doing is the workshop's, not a phone's: on a small screen held in the hand it took the top of the picture (#367). `?status=1` shows it there. */
  @media (pointer: coarse) and (max-height: 520px), (pointer: coarse) and (max-width: 520px) { body:not(.status) #hud { display: none; } }
  #hud { position: fixed; left: max(10px, env(safe-area-inset-left)); top: max(10px, env(safe-area-inset-top)); padding: 5px 9px; border-radius: 8px; background: rgba(12, 16, 22, 0.6); font-variant-numeric: tabular-nums; max-width: calc(100vw - 20px); pointer-events: none; }
  #aim { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: rgba(255, 255, 255, 0.85); box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.5); pointer-events: none; }
  #tools { position: fixed; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; gap: 4px; padding: 5px; border-radius: 12px; background: rgba(12, 16, 22, 0.62); max-width: calc(100vw - 120px); overflow-x: auto; }
  #tools button { border: 0; border-radius: 8px; padding: 6px 10px 6px 8px; background: transparent; color: #cfd6df; font: 600 12px -apple-system, system-ui, sans-serif; white-space: nowrap; touch-action: manipulation; }
  #tools button i { font-style: normal; font-weight: 400; opacity: 0.55; margin-right: 6px; }
  #tools button.on { background: #e8ecf1; color: #10141a; }
  /* The round button is a thumb's: with a mouse a click on the picture does what it does (#367). */
  @media (hover: hover) and (pointer: fine) { #boom { display: none; } }
  #boom { position: fixed; right: max(18px, env(safe-area-inset-right)); bottom: max(18px, env(safe-area-inset-bottom)); width: 76px; height: 76px; border-radius: 50%; border: 0; background: rgba(210, 70, 40, 0.85); color: #fff; font: 600 15px -apple-system, system-ui, sans-serif; touch-action: manipulation; }
  /* The layer over the picture (hud.ts). It takes no touch or click itself: only what is in it that is for pressing. */
  #over { position: fixed; inset: 0; pointer-events: none; }
  #over [hidden] { display: none; }
  #said { position: absolute; left: max(10px, env(safe-area-inset-left)); bottom: 132px; max-width: min(420px, 70vw); padding: 6px 10px; border-radius: 8px; background: rgba(12, 16, 22, 0.6); white-space: pre-wrap; overflow-wrap: anywhere; }
  /* The ask bar: always there, quiet until it is opened. */
  #ask { position: absolute; left: 50%; bottom: calc(max(64px, env(safe-area-inset-bottom) + 58px) + var(--lift, 0px)); transform: translateX(-50%); width: min(560px, calc(100vw - 24px)); display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
  /* By touch the round button is at the bar's height: the bar goes over it, keeping left of the thumb's keys on the right edge. */
  @media (pointer: coarse) { #ask { bottom: calc(max(104px, env(safe-area-inset-bottom) + 100px) + var(--lift, 0px)); } #ask-row { box-sizing: border-box; width: calc(100% - 88px); } }
  #ask-row { display: flex; align-items: center; gap: 2px; padding: 3px; border-radius: 14px; background: rgba(12, 16, 22, 0.5); pointer-events: auto; transition: background 0.15s, box-shadow 0.15s; }
  #ask.open #ask-row { background: rgba(246, 245, 240, 0.97); box-shadow: 0 6px 28px rgba(0, 0, 0, 0.35); }
  #line { flex: 1; min-width: 0; padding: 8px 8px; border: 0; outline: 0; background: transparent; color: #e8ecf1; font: 500 16px -apple-system, system-ui, sans-serif; user-select: text; -webkit-user-select: text; }
  #line::placeholder { color: rgba(232, 236, 241, 0.7); }
  #ask.open #line { color: #14181d; }
  #ask.open #line::placeholder { color: rgba(20, 24, 29, 0.45); }
  #ask-row button { flex: none; min-width: 36px; height: 36px; padding: 0 9px; border: 0; border-radius: 11px; background: transparent; color: #e8ecf1; font: 600 15px -apple-system, system-ui, sans-serif; touch-action: manipulation; }
  #ask.open #ask-row button { color: #2a3038; }
  #ask-row #ask-which { font-size: 12px; background: rgba(232, 236, 241, 0.14); }
  #ask.open #ask-row #ask-which { background: rgba(20, 24, 29, 0.08); }
  #ask.open #ask-row #ask-send { background: #14181d; color: #f6f5f0; }
  #ask:not(.open) #ask-send { display: none; }
  #choice { align-self: center; max-width: 100%; padding: 8px 10px 9px; border-radius: 14px; background: rgba(12, 16, 22, 0.78); pointer-events: auto; }
  /* By touch the thumb's keys stand down the right edge over the bar: a question keeps left of them, its answers in reach. */
  @media (pointer: coarse) { #choice { box-sizing: border-box; align-self: flex-start; max-width: calc(100% - 88px); } }
  #choice p { margin: 0 2px 7px; font-size: 14px; }
  #choice div { display: flex; flex-wrap: wrap; gap: 6px; }
  #choice button { border: 0; border-radius: 9px; padding: 7px 12px 7px 9px; background: rgba(232, 236, 241, 0.14); color: #e8ecf1; font: 600 13px -apple-system, system-ui, sans-serif; touch-action: manipulation; }
  #choice button:first-child { background: #e8ecf1; color: #10141a; }
  #choice button i { font-style: normal; font-weight: 400; opacity: 0.6; margin-right: 7px; }
  #starters, #given { display: flex; flex-wrap: wrap; gap: 6px; pointer-events: auto; }
  #starters button { border: 0; border-radius: 999px; padding: 6px 12px; background: rgba(12, 16, 22, 0.66); color: #e8ecf1; font: 500 13px -apple-system, system-ui, sans-serif; touch-action: manipulation; }
  #given span { display: inline-flex; align-items: center; gap: 6px; padding: 4px 4px 4px 10px; border-radius: 10px; background: rgba(12, 16, 22, 0.72); max-width: 100%; overflow: hidden; white-space: nowrap; }
  #given img { height: 44px; max-width: 88px; margin: 0 0 0 -6px; border-radius: 7px; object-fit: cover; display: block; }
  #given button { width: 24px; height: 24px; border: 0; border-radius: 50%; background: rgba(232, 236, 241, 0.16); color: #e8ecf1; font: 600 14px/1 -apple-system, system-ui, sans-serif; }
  #notices { position: absolute; left: 50%; top: max(44px, calc(env(safe-area-inset-top) + 34px)); transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; max-width: min(520px, 86vw); }
  #notices p { margin: 0; padding: 6px 12px; border-radius: 8px; background: rgba(12, 16, 22, 0.72); overflow-wrap: anywhere; }
  /* Top left, under the line that says how the page is doing: at the top right it lay under the Portal and Realms buttons (#367). */
  #card { position: absolute; left: max(12px, env(safe-area-inset-left)); top: calc(max(12px, env(safe-area-inset-top)) + 46px); min-width: 150px; padding: 8px 12px 10px; border-radius: 10px; background: rgba(12, 16, 22, 0.66); }
  /* The keys of a thing ridden, by touch only (living.ts): a column on the corner under the right thumb, from the bottom up.
     (In a realm they are the kit's keys and play-hud.ts places them; this is how they look on a page without the kit.) */
  [data-panel="living"] { position: absolute; right: max(14px, env(safe-area-inset-right)); bottom: max(20px, env(safe-area-inset-bottom)); display: none; flex-direction: column-reverse; align-items: flex-end; gap: 8px; pointer-events: auto; }
  @media (pointer: coarse) { html.riding [data-panel="living"] { display: flex; } }
  /* By touch the ask bar steps aside while riding, unless it is open: on its side it lay across the thing ridden and the
     keys beside the thumb. Getting off brings it back. */
  @media (pointer: coarse) { html.riding #ask:not(.open) { visibility: hidden; } }
  /* Nothing is aimed at from a seat: the aim's dot was over the thing ridden. */
  html.riding #aim { display: none; }
  html:not([data-hud]) [data-panel="living"] button { min-width: 84px; min-height: 44px; padding: 12px 14px; border: 0; border-radius: 12px; background: rgba(12, 16, 22, 0.72); color: #e8ecf1; font: 600 14px -apple-system, system-ui, sans-serif; touch-action: manipulation; }
  html:not([data-hud]) [data-panel="living"] button[aria-pressed="true"] { background: #e8ecf1; color: #10141a; }
  #card h2 { margin: 0 0 4px; font: 600 13px -apple-system, system-ui, sans-serif; }
  #card p { margin: 2px 0; color: #cfd6df; }
  #card p.note { margin: -2px 0 6px; color: #9aa5b1; font-size: 12px; }
  #card kbd, #cues kbd { display: inline-block; min-width: 14px; margin-right: 8px; padding: 0 5px; border-radius: 4px; background: rgba(232, 236, 241, 0.16); color: #e8ecf1; font: 600 11px/18px ui-monospace, monospace; text-align: center; }
  #cues p { position: absolute; left: 0; top: 0; margin: 0; padding: 3px 9px; border-radius: 8px; background: rgba(12, 16, 22, 0.7); width: max-content; max-width: min(320px, 70vw); will-change: transform; }
  /* A cue that does what it says when touched is a key for a thumb: 44 px tall (Apple's least for a frequent control). */
  @media (pointer: coarse) { #cues p.tap { padding: 13px 16px; line-height: 18px; border-radius: 12px; } }
  [data-panel="wand"] { position: absolute; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: none; flex-direction: column; align-items: center; gap: 6px; max-width: calc(100vw - 120px); pointer-events: auto; }
  body.wand [data-panel="wand"] { display: flex; }
  body.wand #tools { display: none; }
  body.wand #aim { background: #bfe9ff; box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.5), 0 0 10px 2px rgba(150, 220, 255, 0.7); }
  [data-panel="wand"] .says { padding: 5px 11px; border-radius: 9px; background: rgba(12, 16, 22, 0.62); font-variant-numeric: tabular-nums; text-align: center; }
  [data-panel="wand"] .row { display: flex; gap: 4px; padding: 5px; border-radius: 12px; background: rgba(12, 16, 22, 0.62); }
  [data-panel^="wand"] button { border: 0; border-radius: 8px; padding: 6px 10px 6px 8px; background: transparent; color: #cfd6df; font: 600 12px -apple-system, system-ui, sans-serif; white-space: nowrap; touch-action: manipulation; }
  [data-panel^="wand"] button i { font-style: normal; font-weight: 400; opacity: 0.55; margin-right: 6px; }
  [data-panel^="wand"] button.on { background: #bfe9ff; color: #10141a; }
  [data-panel="wand"] .gap { width: 1px; margin: 4px 3px; background: rgba(255, 255, 255, 0.16); }
  [data-panel="wand-take"] { position: absolute; left: max(10px, env(safe-area-inset-left)); bottom: max(14px, env(safe-area-inset-bottom)); pointer-events: auto; }
  [data-panel="wand-take"] button { padding: 9px 12px; border-radius: 12px; background: rgba(12, 16, 22, 0.62); }
  [data-panel="offers"] { position: absolute; right: max(14px, env(safe-area-inset-right)); bottom: 110px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; pointer-events: auto; }
  [data-panel="offers"] button { border: 0; border-radius: 10px; padding: 7px 12px 7px 8px; background: rgba(12, 16, 22, 0.66); color: #e8ecf1; font: 600 13px -apple-system, system-ui, sans-serif; white-space: nowrap; touch-action: none; user-select: none; -webkit-user-select: none; }
  [data-panel="offers"] button kbd { display: inline-block; min-width: 18px; margin-right: 8px; padding: 1px 4px; border-radius: 5px; background: rgba(255, 255, 255, 0.16); font: 600 11px ui-monospace, monospace; text-align: center; }
  [data-panel="offers"] button.on, [data-panel="offers"] button:active { background: #e8ecf1; color: #10141a; }
  @media (pointer: coarse) { [data-panel="offers"] button { min-height: 48px; padding: 0 16px; border-radius: 24px; font-size: 15px; } [data-panel="offers"] button kbd { display: none; } }
  [data-panel="shown"] { position: absolute; left: 50%; top: max(44px, calc(env(safe-area-inset-top) + 34px)); transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; max-width: min(560px, calc(100vw - 24px)); pointer-events: none; }
  [data-panel="shown"] .card { display: flex; align-items: center; gap: 12px; padding: 8px 14px; border-radius: 12px; background: rgba(12, 16, 22, 0.66); color: #e8ecf1; }
  [data-panel="shown"] .score { display: flex; flex-direction: column; align-items: center; min-width: 44px; }
  [data-panel="shown"] .score b { font: 700 24px/1 -apple-system, system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  [data-panel="shown"] .score span { margin-top: 3px; font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.7; }
  [data-panel="shown"] .body { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  [data-panel="shown"] .line { margin: 0; font: 500 14px/1.35 -apple-system, system-ui, sans-serif; overflow-wrap: anywhere; }
  [data-panel="shown"] .meter { display: flex; align-items: center; gap: 8px; font-size: 11px; }
  [data-panel="shown"] .meter span { min-width: 64px; opacity: 0.8; white-space: nowrap; }
  [data-panel="shown"] .meter > i { display: block; width: 180px; max-width: 46vw; height: 8px; border-radius: 4px; background: rgba(255, 255, 255, 0.16); overflow: hidden; }
  [data-panel="shown"] .meter > i > i { display: block; height: 100%; border-radius: 4px; background: #e8ecf1; transition: width 0.25s ease-out; }
  [data-panel="shown"] .picks { display: flex; flex-wrap: wrap; gap: 6px; pointer-events: auto; }
  [data-panel="shown"] .picks button { border: 0; border-radius: 9px; padding: 7px 12px; background: #e8ecf1; color: #10141a; font: 600 13px -apple-system, system-ui, sans-serif; touch-action: manipulation; }
  @media (pointer: coarse) { [data-panel="shown"] .picks button { min-height: 44px; padding: 0 16px; font-size: 15px; } }
</style>
</head>
<body>
<canvas></canvas>
<div id="hud">Starting</div>
<div id="aim"></div>
<div id="tools"></div>
<button id="boom" aria-label="Use the tool picked on what is ahead">use</button>
<script type="module" src="/page/main.ts"></script>
</body>
</html>
