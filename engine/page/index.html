<title>Village engine</title>
<style>
  html, body { margin: 0; height: 100%; background: #10141a; color: #e8ecf1; font: 13px/1.4 -apple-system, system-ui, sans-serif; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }

  @media (pointer: coarse) and (max-height: 520px), (pointer: coarse) and (max-width: 520px) { body:not(.status) #hud { display: none; } }

  @media (pointer: coarse) { html:not([data-hud]) #ask { bottom: calc(max(104px, env(safe-area-inset-bottom) + 100px) + var(--lift, 0px)); } html:not([data-hud]) #ask-row { box-sizing: border-box; width: calc(100% - 88px); } }
  #ask-row { position: relative; display: flex; align-items: center; gap: 3px; padding: 4px 5px; border-radius: 3px; background: rgba(20, 26, 38, 0.72); border: 1.5px solid rgba(94, 114, 146, 0.42); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); box-shadow: 0 4px 18px rgba(0, 0, 0, 0.3); pointer-events: auto; cursor: pointer; transition: background 0.16s ease-out, border-color 0.16s ease-out, box-shadow 0.16s ease-out; }

  #ask.open #ask-row .ask-kbd { display: none; }
  #line { flex: 1; min-width: 0; padding: 7px 6px; border: 0; outline: 0; background: transparent; color: #f2f5f9; font: 500 15px/1.3 -apple-system, system-ui, sans-serif; user-select: text; -webkit-user-select: text; }

  #notices { position: absolute; left: 50%; top: max(20px, calc(env(safe-area-inset-top) + 14px)); transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; max-width: min(480px, 84vw); }
  #notices p { margin: 0; padding: 7px 14px; border-radius: 3px; background: rgba(18, 24, 34, 0.82); border: 1.5px solid rgba(94, 114, 146, 0.42); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 4px 18px rgba(0, 0, 0, 0.32); font: 500 13px/1.3 -apple-system, system-ui, sans-serif; overflow-wrap: anywhere; }
  /* Top left, slim machined controls card when mounted on desktop. */

  /* The keys of a thing ridden, by touch only (living.ts): a column on the corner under the right thumb, wrapping into two columns on short screens. */
  [data-panel="living"] { position: absolute; right: max(14px, env(safe-area-inset-right)); bottom: max(110px, env(safe-area-inset-bottom)); display: none; flex-direction: column-reverse; flex-wrap: wrap-reverse; align-items: flex-end; align-content: flex-end; max-height: calc(100vh - 124px); gap: 8px; pointer-events: auto; }

  /* By touch (and while driving a car) the ask bar steps aside unless opened, keeping the car and road clear. */

  /* Driving cluster (living.ts): speed, gear, 12-segment RPM bar, and DRIFT badge. Machined low-profile housing. */
  [data-panel="drive-hud"] { position: absolute; right: max(18px, env(safe-area-inset-right)); bottom: max(18px, env(safe-area-inset-bottom)); display: none; flex-direction: column; gap: 5px; padding: 9px 13px 10px; border-radius: 3px; background: rgba(20, 26, 38, 0.74); border: 1.5px solid rgba(94, 114, 146, 0.44); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); color: #f2f5f9; pointer-events: none; font-variant-numeric: tabular-nums; box-shadow: 0 6px 22px rgba(0, 0, 0, 0.34), inset 1px 1px 0 rgba(255, 255, 255, 0.14); }

  /* Driving stunt & combo HUD (stunts.ts): completely hidden until scoring, banking, or busting. */
  [data-panel="stunts"] { position: absolute; left: 50%; top: max(22px, calc(env(safe-area-inset-top, 0px) + 14px)); transform: translateX(-50%); display: none; flex-direction: column; align-items: center; gap: 4px; min-width: 196px; max-width: min(380px, calc(100vw - 32px)); padding: 8px 16px 10px; border-radius: 13px; border: 1px solid rgba(255, 255, 255, 0.14); background: rgba(12, 16, 22, 0.76); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); color: #f4f7fb; pointer-events: none; font-variant-numeric: tabular-nums; box-shadow: 0 8px 28px rgba(0, 0, 0, 0.34); overflow: hidden; opacity: 1; transition: opacity 0.22s ease-out, border-color 0.2s ease-out; }
