<!-- The loader (#450): what a realm's page shows from its first byte until the visitor can use it. sf/build.mjs puts it
     in the realm's page, with the realm's name and its first view (sf/loading.json, written by sf/loading.mjs). It
     owes the page's code nothing, so it is there while that code comes.

     Karl the Fog: the city's own fog lies over the first view. At first only the tallest spires and the sky stand over
     it; as each stage the page passes ends, it sinks and burns off, the towers first, then the hills, then the
     streets. When the place is shown and its boards are up (main.ts says `done`, where it tells its host `ready`), the
     last of it clears over the live picture, taken from the same eye with the same lens, and the picture goes with it.
     The fog is a small field, drawn each frame and scaled up: two banks of it, drifting each its own way, lit from
     above, thicker low down.

     main.ts tells it through page/loading.ts: step(stage) as each ends, progress(share) during the last, done(),
     fail() (the page's own words are then shown over it, and it dims). Without motion wanted, the fog stands still and
     steps down at each stage, each step a cross-fade. -->

<style>

  #loading p { margin: 0; font: 500 13px/1.3 -apple-system, system-ui, sans-serif; color: #cfd6df; }

  #loading li { width: 10px; height: 10px; border-radius: 2px; background: rgba(232, 236, 241, 0.14); box-shadow: inset 0 1px rgba(255, 255, 255, 0.06); transition: background 0.2s ease-out; }
  #loading li.done { background: #e8ecf1; box-shadow: inset 0 1px #fff, inset 0 -2px rgba(16, 20, 26, 0.18); }
  #loading li.now { animation: loading-breathe 1.1s ease-in-out infinite alternate; }

  .vw-fail { position: fixed; inset: 0; z-index: 46; box-sizing: border-box; margin: auto; height: fit-content; width: min(26rem, calc(100vw - 32px)); max-height: calc(100dvh - 32px); overflow: auto; display: grid; gap: 10px; padding: 22px 22px 18px; border-radius: 14px; background: rgba(12, 16, 22, 0.82); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); color: #e8ecf1; box-shadow: inset 0 1px rgba(255, 255, 255, 0.08), 0 12px 40px rgba(8, 12, 18, 0.45), 0 0 0 200vmax rgba(6, 9, 13, 0.4); font: 400 16px/1.45 -apple-system, system-ui, sans-serif; text-align: left; animation: loading-in 0.35s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
  .vw-fail h2 { margin: 0 0 4px; font: 400 21px/1.3 "Vox Zakon", system-ui, sans-serif; letter-spacing: 0.05em; text-transform: uppercase; }

  @keyframes loading-say { from { opacity: 0.35; translate: 0 2px; } }
  @keyframes loading-breathe { from { background: rgba(232, 236, 241, 0.2); } to { background: rgba(232, 236, 241, 0.55); } }

<div id="loading" tabindex="-1" role="progressbar" aria-label="Opening {{name}}" aria-valuemin="0" aria-valuemax="5" aria-valuenow="0">

</div>
<script>

  /** The stages, in the order the page passes them (main.ts), what each is called while it lasts, and its share of the fog's way down (the view, the last, is most of the wait). */
  const STAGES = [['gpu', 'Waking the graphics card', 0.08], ['engine', 'Starting the engine', 0.12], ['skyline', 'Raising the skyline', 0.12], ['streets', 'Fetching the streets', 0.12], ['view', 'Drawing the view', 0.56]]

  // then a guess by the same rule: upright where taller than wide, and none where the address puts the eye elsewhere.

  const which = () => (!PICTURES ? null : told !== undefined ? told : ['at', 'look', 'fov', 'roll'].some((k) => asked.has(k)) ? null : innerHeight > innerWidth ? 'upright' : 'wide')

  let reached = 0, share = 0, since = performance.now(), finishing = 0, over = false

  // Nor can the keyboard reach what is under it: focus that lands on anything not itself on top at its middle (under the
  // fog, or under something over it) comes back to it. (What is shown over it, such as the site's notice, is reached as

  const covered = (el) => { const r = el.getBoundingClientRect(), at = document.elementFromPoint(r.left + r.width / 2, r.top + r.height / 2); return !at || !el.contains(at) }

  const free = () => { for (const type of ['keydown', 'wheel']) removeEventListener(type, hold, { capture: true }); document.removeEventListener('focusin', keep, true) }

  const remove = () => {
    over = true; free(); root.remove(); removeEventListener('resize', resize)
    low.width = low.height = shown.width = shown.height = 0
    picture = field = null
    for (const k in decoded) delete decoded[k]

  const fade = () => { if (fading) return; fading = true; root.classList.add('done', 'faded'); setTimeout(remove, 320) }

  // ── The fog's stuff: smooth value noise in tiles that repeat each way, the broad octaves in one and the fine in another (the fine fade with distance, where they would flicker) ──
  const T = 128
  const bake = (octaves, seed) => {
    const tile = new Float32Array(T * T), rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647

  /** The picture for how the page is framed now, once it has come and is decoded (`decoded` keeps each), which framing it is, and when it came. */
  let picture = null, framed = null, seenAt = 0
  const decoded = {}
  /** Where the fog starts, as a share of the frame's height from its top: just under the highest towers in the window, a little way down to the middle of its skyline. */

  const size = () => {

   * billows are broad near the eye and flat and fine far off, and drift faster near. Two banks of it, the far one a
   * little higher and drifting one way, the near one lower and the other way. Each is thickest under its broken top,

  const goal = (now) => {

    for (let i = 0; i < Math.min(reached, STAGES.length); i++) before += STAGES[i][2]

      }

        const d = field.data
        if (was) for (let i = 0; i < d.length; i++) d[i] = was[i] + (d[i] - was[i]) * k
        if (shownData?.length !== d.length) shownData = new Uint8ClampedArray(d.length)
        shownData.set(d)
        if (picture && !seenAt) seenAt = now - 1e4
        // (The picture's nearness and the haze step with it.)
        shownV = was ? wasV + (stillV - wasV) * k : stillV
        paint(1, 1, shownV)
        if (k >= 1) was = null
        drawn = now
      }
      if (finishing) { fade(); return false }
      return true
    }
    v += (aim - v) * (1 - Math.exp(-dt / (finishing ? 0.25 : 0.45)))
    lift ??= pictured ? 1 : 0
    lift += ((pictured ? 1 : 0) - lift) * (1 - Math.exp(-dt / 0.45))
    fog(v * lift, t, left)
    if (picture && !seenAt) seenAt = now
    // The picture comes in under the fog as its bytes are decoded, rather than appear.
    paint(through * ease((now - seenAt) / 500), left, v * lift)
    drawn = now
    return true
  }
  /** The frame: the picture (`shownAs` how much of it), a haze as light as the fog is far gone, the fog. */
  const paint = (shownAs, left, v) => {
    soften(field.data)
    l.putImageData(field, 0, 0)
    g.clearRect(0, 0, W, H)
    if (picture && shownAs > 0) {
      // As the live picture lays it: as tall as the frame, centred; a breath nearer while the fog is thick, at rest when it has gone.
      const s = (H / picture.height) * (1 + 0.025 * (1 - ease(v))), w = picture.width * s, h = picture.height * s
      const x = (W - w) / 2, y = (H - h) / 2
      g.globalAlpha = shownAs
      g.drawImage(picture, x, y, w, h)
      // A window wider than the picture has it mirrored at its sides, a sliver of city where the live one will be.
      if (x > 0) { g.save(); g.scale(-1, 1); g.drawImage(picture, -x, y, w, h); g.drawImage(picture, -(x + 2 * w), y, w, h); g.restore() }
      g.globalAlpha = 1
    }
    const haze = 0.12 * (1 - v) * left
    if (haze > 0.004) { g.fillStyle = `rgba(236,240,245,${haze.toFixed(3)})`; g.fillRect(0, 0, W, H) }
    g.imageSmoothingEnabled = true
    g.imageSmoothingQuality = 'high'
    g.drawImage(low, 0, 0, W, H)
  }

  /** A picture, asked for (before the page's own bytes, which are many) and decoded once; laid if it is the one the page frames now. */
  const decode = (key) => {
    decoded[key] = undefined
    const image = new Image()
    image.fetchPriority = 'high'
    image.src = PICTURES[key].file
    image.decode().then(() => { if (over) return; decoded[key] = image; if (key === which()) size() }, () => { if (over) return; decoded[key] = null; if (key === which()) size() })
  }
  let resized = 0
  const resize = () => { cancelAnimationFrame(resized); resized = requestAnimationFrame(size) }
  size()
  addEventListener('resize', resize)
  requestAnimationFrame(frame)

  globalThis.villageLoading = {
    step(stage) { const i = STAGES.findIndex(([s]) => s === stage); if (i >= 0 && i + 1 > reached && !finishing) { reached = i + 1; share = 0; since = performance.now(); say() } },
    progress(part) { if (Number.isFinite(part) && part >= 0 && Math.min(1, part) > share) { share = Math.min(1, part); since = performance.now() } },
    view(kind) { if (over) return; told = kind; size() },
    // The place is ready: from now every touch and key is the page's, while the last of the fog clears over it.
    done() {
      if (finishing || over) return
      finishing = performance.now(); reached = STAGES.length; say(); root.classList.add('done'); free()
      // The live picture is under its own; with none (or none come yet), the sky goes with the fog.
      if (picture) root.classList.add('bare')
      else if (!still) { root.style.transition = 'opacity 1.5s ease-in'; root.style.opacity = '0' }
      if (document.hidden) remove()
    },
    // The view it would have opened on, clear and dimmed, under the page's own words.
    fail() {
      if (over) return
      // (The site's notices read this, #81: nothing else is shown over why the realm did not open.)
      document.documentElement.dataset.failed = '1'
      root.classList.add('failed'); root.removeAttribute('aria-valuenow'); root.setAttribute('aria-valuetext', 'Could not open')
      size()
    },
  }
})()
</script>
