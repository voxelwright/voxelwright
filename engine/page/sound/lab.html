<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Village sound</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; background: #10141a; color: #e8ecf1; font: 15px/1.45 -apple-system, system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
  main { max-width: 860px; margin: 0 auto; padding: max(14px, env(safe-area-inset-top)) 16px 60px; }
  h1 { font-size: 20px; margin: 6px 0 2px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: #8f9bab; margin: 22px 0 8px; font-weight: 600; }
  p { margin: 4px 0 10px; color: #aab4c2; }
  #state { position: sticky; top: 0; z-index: 2; background: #10141af0; padding: 8px 0; font-variant-numeric: tabular-nums; color: #cfd6df; font-size: 13px; }
  #state b { color: #ffd27a; }
  canvas { width: 100%; height: 120px; display: block; border-radius: 8px; background: #05070a; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; }
  button { border: 0; border-radius: 9px; padding: 10px 13px; background: #222a35; color: #e8ecf1; font: 600 14px -apple-system, system-ui, sans-serif; touch-action: manipulation; }
  button:active, button.on { background: #e8ecf1; color: #10141a; }
  label { display: flex; align-items: center; gap: 10px; margin: 6px 0; }
  label span { width: 92px; color: #aab4c2; }
  input[type=range] { flex: 1; }
  textarea { width: 100%; box-sizing: border-box; height: 150px; border-radius: 8px; border: 1px solid #2c3644; background: #0b0e13; color: #dfe6ee; font: 12px/1.4 ui-monospace, Menlo, monospace; padding: 8px; -webkit-user-select: text; user-select: text; }
  #said { color: #ffb38a; min-height: 1.4em; }
  .stage { width: 100%; max-height: 62vh; margin-top: 10px; border-radius: 10px; background: #0b0e13; touch-action: none; }
  .sheet { font-size: 13px; color: #c3ccd8; margin-top: 8px; }
  .sheet summary { padding: 5px 0; font-weight: 600; }
  .sheet table { border-collapse: collapse; margin: 2px 0 8px; }
  .sheet td { padding: 2px 10px 2px 0; vertical-align: top; border-top: 1px solid #1d2530; }
  .sheet td:first-child { font-variant-numeric: tabular-nums; color: #ffd27a; }
  .sheet td:last-child { color: #8f9bab; }
  .keys { display: flex; gap: 3px; touch-action: none; }
  .keys button { flex: 1; padding: 34px 0 10px; min-width: 0; font-size: 12px; }
  .keys button.sharp { background: #0b0e13; color: #8f9bab; }
</style>
</head>
<body>
<main>
  <h1>Village sound</h1>
  <p>Everything here is computed as it plays: there is no recording behind any of it. Tap anything to start.</p>
  <div id="state">Tap to start sound</div>
  <canvas id="scope" width="860" height="240"></canvas>
  <div id="sections"></div>
</main>
<script type="module" src="/page/sound/lab.ts"></script>
</body>
</html>
